services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dentbid
      POSTGRES_PASSWORD: dentbid
      POSTGRES_DB: dentbid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentbid"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://dentbid:dentbid@db:5432/dentbid
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    volumes:
      - media:/data/media
      - ./ml/weights:/srv/ml/weights:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
